name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/xhs-english-mindmap-series/requirements.txt
      - run: python scripts/check_plugin.py
      - run: python -X utf8 skills/xhs-english-mindmap-series/scripts/test_regressions.py
